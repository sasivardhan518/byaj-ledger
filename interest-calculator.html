<style>
/* Layout: flat, quiet surfaces so the figures lead. Deposits on the left, figures on the right. Dark by default, light by choice.
   Colour marks only what you can act on or must notice. Palette: deep blue #086288, steel #4D8DBA, sky #97D7FF, cream #FFEFC4. */
:root {
  --bg: #0d1a20; --surface: #13242c; --field: #0f1f26; --sunken: #1a2f39; --ink: #f1f4f5; --muted: #b4c4cc; --rule: #2c4450; --steel: #4D8DBA;
  --accent: #97D7FF; --on-accent: #0d1a20; --stamp: #FFEFC4; --stamp-bg: #1d3542; --warn: #FFEFC4; --warn-bg: #33301f; --bad: #ffb9ad; color-scheme: dark;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="light"] {
  --bg: #f7f7f4; --surface: #ffffff; --field: #ffffff; --sunken: #eef0ee; --ink: #14242b; --muted: #4a5d67; --rule: #d7dcdc; --steel: #4D8DBA;
  --accent: #086288; --on-accent: #ffffff; --stamp: #086288; --stamp-bg: #e6f2f9; --warn: #6f4d00; --warn-bg: #FFEFC4; --bad: #a32f26; color-scheme: light }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px }
header { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between }
h1 { font: 400 3rem/1.05 var(--display); letter-spacing: -.01em; margin: 0 } h2 { font: 400 1.65rem/1.2 var(--display); margin: 0; text-wrap: balance } h3 { font: 600 .98rem/1.3 var(--body); margin: 0 }
header p { margin: 4px 0 0; color: var(--muted); max-width: 62ch }
nav, .seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 22px; width: fit-content; max-width: 100% }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--rule); background: var(--field); border-radius: 999px; padding: 6px 14px; transition: border-color .15s, background-color .15s }
button:hover { border-color: var(--steel) }

.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
button.copy { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; color: var(--muted); background: transparent; border-color: transparent; font-size: .72rem; font-weight: 600 }
button.copy:hover { color: var(--accent); background: var(--sunken) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
nav button, .seg button { border-color: transparent; background: none; font-weight: 500 }
nav button[aria-selected="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent) }
.link { border: 0; background: none; padding: 0; border-radius: 3px; color: var(--accent); text-decoration: underline; text-align: left }
.danger { color: var(--bad) }
.cols { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; align-items: start }
.stack { display: grid; gap: 16px; min-width: 0 } .tight { display: grid; gap: 8px; min-width: 0 }
.sheet { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; display: grid; gap: 14px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between }
.dep { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; width: 100%; text-align: left; padding: 10px 14px; border-radius: 14px }
.dep[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.dep b { font-weight: 600; overflow-wrap: anywhere } .dep small { color: var(--muted); grid-column: 1 / -1 }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px }
.fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)) }
label { display: grid; gap: 3px; font-size: .84rem; font-weight: 500; color: var(--muted); align-content: start; min-width: 0 }
textarea { font: 400 .85rem var(--body); color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; width: 100%; min-height: 90px; resize: vertical }
#sync { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 18px }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500 }

input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85 }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px }
.tile { position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px } .tile span { display: block; font-size: .82rem; color: var(--muted); padding-right: 26px }
.tile b { display: block; font: 600 1.45rem/1.3 var(--body); font-variant-numeric: tabular-nums; overflow-wrap: anywhere } .tile small { color: var(--muted); font-size: .78rem }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 14px; max-height: 620px; overflow-y: auto }

th:first-child, td:first-child { text-align: left }
td.txt, th.txt { text-align: left; white-space: normal; min-width: 130px }
thead th { position: sticky; top: 0; background: var(--sunken); font-weight: 600; font-size: .82rem; z-index: 1 }

td small { display: block; color: var(--muted); font-size: .76rem }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap }
.pill.stamp { background: var(--stamp-bg); color: var(--stamp) } .pill.ok { color: var(--accent) } .pill.warn { background: var(--warn-bg); color: var(--warn) }
.note { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 12px; font-size: .88rem } .note.stamp { background: var(--stamp-bg); color: var(--stamp) }
.prose { font-size: .9rem; color: var(--muted); display: grid; gap: 6px; max-width: 80ch } .prose p, .prose ul { margin: 0 } .prose ul { padding-left: 18px; display: grid; gap: 4px } .prose strong { color: var(--ink); font-weight: 600 }
.txrow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 6px }
.txrow.misc { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) auto }
@media (max-width: 560px) { .txrow.misc { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto } .txrow.misc > :first-child { grid-column: 1 / -1 } }
@media (max-width: 920px) { .cols { grid-template-columns: minmax(0, 1fr) } }

<script>
/*ENGINE-START*/
const DAY = 864e5, RS = '₹';
const dn = s => { const [y, m, d] = String(s).split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY };
const parts = n => { const t = new Date(n * DAY); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() } };
const iso = n => new Date(n * DAY).toISOString().slice(0, 10);
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
function addMonths(n, k) {
  const p = parts(n), first = Date.UTC(p.y, p.m - 1 + k, 1), last = new Date(Date.UTC(p.y, p.m + k, 0)).getUTCDate();
  return first / DAY + Math.min(p.d, last) - 1;
}
const isMonthEnd = n => parts(n + 1).d === 1;
const fyOf = n => { const p = parts(n); return p.m >= 4 ? p.y : p.y - 1 };
const qOf = n => { const m = parts(n).m; return m >= 4 ? Math.ceil((m - 3) / 3) : 4 };
const fyLabel = y => `FY ${y}-${String((y + 1) % 100).padStart(2, '0')}`;

function naturalEnd(dep) {
  if (dep.mode === 'sav') return dn(dep.end) + 1;
  return addMonths(dn(dep.start), (+dep.ty || 0) * 12 + (+dep.tm || 0)) + (+dep.td || 0);
}
/* A deposit you really closed early stops on that date. A date on or after maturity changes nothing. */
const closedEarly = dep => dep.mode !== 'sav' && !!dep.closedOn && dep.closedOn === String(dep.closedOn) && dn(dep.closedOn) < naturalEnd(dep);
function endOf(dep) {
  if (dep.closeEnd != null) return dep.closeEnd;
  return closedEarly(dep) ? dn(dep.closedOn) : naturalEnd(dep);
}
const dealRate = dep => dep.closeEnd == null && closedEarly(dep) && dep.closedRate !== '' && dep.closedRate != null ? +dep.closedRate : +dep.rate;

/* Every rate and limit the tax maths uses. Percentages are whole numbers; upto: null means "and above". */
const DEFAULT_RULES = {
  newSlabs: [{ upto: 400000, rate: 0 }, { upto: 800000, rate: 5 }, { upto: 1200000, rate: 10 }, { upto: 1600000, rate: 15 }, { upto: 2000000, rate: 20 }, { upto: 2400000, rate: 25 }, { upto: null, rate: 30 }],
  oldSlabs: [{ upto: 250000, rate: 0 }, { upto: 500000, rate: 5 }, { upto: 1000000, rate: 20 }, { upto: null, rate: 30 }],
  oldSeniorExempt: 300000, stdNew: 75000, stdOld: 50000,
  rebateNewLimit: 1200000, rebateOldLimit: 500000, rebateOldMax: 12500,
  stcgRate: 20, ltcgRate: 12.5, ltcgExempt: 125000, cess: 4,
  surcharge: [{ over: 5000000, rate: 10 }, { over: 10000000, rate: 15 }, { over: 20000000, rate: 25 }, { over: 50000000, rate: 37 }],
  surchargeCapNew: 25, surchargeCapGains: 15,
  tdsPan: 10, tdsNoPan: 20, tdsLimit: 50000, tdsLimitSenior: 100000, dedOld: 10000, dedOldSenior: 50000,
  advanceMin: 10000, lateRate: 1, yearEndPct: 90,
  instalments: [{ m: 6, d: 15, pct: 15, safe: 12, months: 3 }, { m: 9, d: 15, pct: 45, safe: 36, months: 3 }, { m: 12, d: 15, pct: 75, safe: 75, months: 3 }, { m: 3, d: 15, pct: 100, safe: 100, months: 1 }]
};

/* Walks the deposit one day at a time, the way a core banking system accrues.
   Maturity day itself earns nothing: start date counts, end date does not. */
function simulate(dep) {
  const start = dn(dep.start), end = endOf(dep), days = end - start, r = dealRate(dep), mode = dep.mode;
  const rate = mode === 'mpay' ? r / (1 + r / 1200) : r;   // monthly payout FDs use the discounted rate
  const simple = mode === 'cum' && days < 180 && dep.shortSimple !== false;
  const roundTo = dep.round === 'rupee' ? 1 : 100, round = x => Math.round(x * roundTo) / roundTo;
  const every = mode === 'mpay' ? 1 : 3, credits = new Set();
  if (!simple) {
    if (dep.basis === 'anniv') for (let k = 1; addMonths(start, every * k) - 1 < end; k++) credits.add(addMonths(start, every * k) - 1);
    else for (let n = start; n < end; n++) if (isMonthEnd(n) && (every === 1 || parts(n).m % 3 === 0)) credits.add(n);
  }
  const tx = new Map(), addTx = (d, a) => tx.set(d, (tx.get(d) || 0) + a);
  const amt = +dep.amt;
  if (mode === 'rd') for (let k = 0; addMonths(start, k) < end; k++) addTx(addMonths(start, k), amt);
  else addTx(start, amt);
  if (mode === 'sav') for (const t of dep.tx || []) if (t.date && +t.amt) { const d = dn(t.date); if (d >= start && d < end) addTx(d, +t.amt) }
  const payout = mode === 'qpay' || mode === 'mpay', rows = [], receipts = [], flows = [];
  let bal = 0, pend = 0, invested = 0, total = 0, overdrawn = false;
  for (let n = start; n < end; n++) {
    const added = tx.get(n) || 0;
    bal += added; invested += added;
    if (bal < 0) { overdrawn = true; bal = 0 }
    if (added) flows.push([n, -added]);
    const base = bal, denom = dep.dc === 'actual' && isLeap(parts(n).y) ? 366 : 365;
    let acc = base * rate / 100 / denom, credit = 0;
    pend += acc;
    const last = n === end - 1;
    if (credits.has(n) || last) {
      credit = round(pend);
      pend -= credit;
      if (last) { acc -= pend; pend = 0 }   // absorb rounding so accruals always tally with credits
      total += credit;
      if (payout) { receipts.push([last ? end : n, credit]); flows.push([last ? end : n, credit]) }
      else { bal += credit; if (mode === 'sav') receipts.push([n, credit]) }
    }
    rows.push({ n, added, base, acc, credit, pend: Math.max(pend, 0), close: bal });
  }
  if (!payout && mode !== 'sav') receipts.push([end, total]);
  flows.push([end, bal]);
  return { start, end, days, rate, simple, rows, receipts, total, invested, maturity: bal, overdrawn, flows, xirr: xirr(flows), credits: credits.size };
}

function xirr(flows) {
  if (flows.length < 2) return null;
  const t0 = flows[0][0], npv = r => flows.reduce((s, [d, a]) => s + a / Math.pow(1 + r, (d - t0) / 365), 0);
  let lo = -0.9, hi = 2;
  if (npv(lo) * npv(hi) > 0) return null;
  for (let i = 0; i < 100; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m }
  return (lo + hi) / 2 * 100;
}

/* The shortcut formula most online calculators use, shown so a bank figure can be reconciled. */
function textbook(dep, s) {
  const P = +dep.amt, r = dealRate(dep), i = r / 400;
  if (dep.mode === 'cum') return s.simple ? P * r * s.days / 36500 : P * Math.pow(1 + i, 4 * s.days / 365) - P;
  if (dep.mode === 'qpay') return P * r * s.days / 36500;
  if (dep.mode === 'mpay') return P * s.rate * s.days / 36500;
  if (dep.mode === 'rd') { const n = s.rows.filter(x => x.added).length; let a = 0; for (let k = 1; k <= n; k++) a += P * Math.pow(1 + i, k / 3); return a - P * n }
  return null;
}

function group(rows, keyFn) {
  const out = new Map();
  for (const x of rows) {
    const k = keyFn(x.n);
    let g = out.get(k);
    if (!g) out.set(k, g = { key: k, from: x.n, to: x.n, days: 0, open: x.base - x.added, added: 0, acc: 0, credit: 0, close: 0 });
    g.to = x.n; g.days++; g.added += x.added; g.acc += x.acc; g.credit += x.credit; g.close = x.close;
  }
  return [...out.values()];
}

/* Interest per Apr-Jun / Jul-Sep / Oct-Dec / Jan-Mar for one FY, by accrual or by money received. */
function quarters(s, fy, basis) {
  const q = [0, 0, 0, 0];
  if (basis === 'receipt') { for (const [d, a] of s.receipts) if (fyOf(d) === fy) q[qOf(d) - 1] += a }
  else for (const x of s.rows) if (fyOf(x.n) === fy) q[qOf(x.n) - 1] += x.acc;
  return q;
}

function taxCalc(items, fy, t, R = DEFAULT_RULES) {
  const senior = t.age === 'senior', limit = senior ? +R.tdsLimitSenior : +R.tdsLimit;
  let interest = 0, savings = 0, tds = 0;
  const banks = new Map();
  for (const { dep, sim } of items) {
    const q = quarters(sim, fy, t.basis), sum = q[0] + q[1] + q[2] + q[3];
    interest += sum;
    if (dep.mode === 'sav') { savings += sum; continue }
    const key = (dep.bank || 'Unnamed bank').trim(), b = banks.get(key.toLowerCase()) || { name: key, q: [0, 0, 0, 0], deps: 0 };
    quarters(sim, fy, 'accrual').forEach((v, i) => b.q[i] += v);   // banks deduct TDS on accrual, whatever basis you file on
    b.deps++; banks.set(key.toLowerCase(), b);
  }
  const bankRows = [...banks.values()].map(b => {
    let run = 0, cross = null;
    b.q.forEach((v, i) => { run += v; if (cross == null && run > limit) cross = i + 1 });
    const tax = run > limit ? run * (t.pan ? +R.tdsPan : +R.tdsNoPan) / 100 : 0;
    tds += tax;
    return { ...b, total: run, cross, tds: tax };
  });
  const deduction = t.regime === 'old' ? Math.min(senior ? +R.dedOldSenior : +R.dedOld, senior ? interest : savings) : 0;
  const tax = Math.max(interest - deduction, 0) * t.slab / 100 * (1 + R.cess / 100);
  return { interest, savings, deduction, tax, tds, net: tax - tds, bankRows, effective: interest ? tax / interest : 0 };
}
/* Full-year income tax: slabs, standard deduction, rebate, special rates on equity gains, surcharge, cess. */
const n0 = x => Math.max(+x || 0, 0);
function bands(regime, age, R) {
  const rows = (regime === 'new' ? R.newSlabs : R.oldSlabs).map(s => [s.upto == null ? Infinity : +s.upto, +s.rate / 100]).sort((a, b) => a[0] - b[0]);
  if (regime === 'old' && age === 'senior') rows[0] = [+R.oldSeniorExempt, rows[0][1]];
  return rows;
}
function slabTax(inc, regime, age, R) {
  let tax = 0, low = 0;
  for (const [top, rate] of bands(regime, age, R)) { if (inc > low) tax += (Math.min(inc, top) - low) * rate; low = top }
  return tax;
}
function fullTax(inc, regime, age, interest, interestDed, R = DEFAULT_RULES) {
  const isNew = regime === 'new', std = Math.min(n0(inc.salary), isNew ? +R.stdNew : +R.stdOld);
  const misc = (inc.misc || []).reduce((s, m) => s + n0(m.amt), 0);
  const slabInc = Math.max(n0(inc.salary) - std + n0(inc.rent) + n0(inc.biz) + n0(inc.other) + misc + n0(interest) - (isNew ? 0 : n0(inc.oldDed) + n0(interestDed)), 0);
  const stcg = n0(inc.stcg), ltcg = n0(inc.ltcg), total = slabInc + stcg + ltcg;
  const special = stcg * R.stcgRate / 100 + Math.max(ltcg - R.ltcgExempt, 0) * R.ltcgRate / 100;
  const slabPart = i => {
    let tax = slabTax(i, regime, age, R);
    const all = i + stcg + ltcg;
    if (isNew) { if (all <= +R.rebateNewLimit) tax = 0; else tax = Math.min(tax, all - R.rebateNewLimit) }   // rebate with marginal relief
    else if (all <= +R.rebateOldLimit) tax = Math.max(tax - R.rebateOldMax, 0);
    return tax;
  };
  const slab = slabPart(slabInc), cess = R.cess / 100;
  const steps = R.surcharge.map(s => [+s.over, (isNew ? Math.min(+s.rate, +R.surchargeCapNew) : +s.rate) / 100]).sort((a, b) => a[0] - b[0]);
  const withSurcharge = (s, r) => s + special + s * r + special * Math.min(r, R.surchargeCapGains / 100);
  let rate = 0, prev = 0, floor = 0;
  for (const [limit, r] of steps) if (total > limit) { prev = rate; rate = r; floor = limit }
  let before = withSurcharge(slab, rate);
  if (rate && rate !== prev) before = Math.min(before, withSurcharge(slabPart(Math.max(slabInc - (total - floor), 0)), prev) + (total - floor));
  const top = bands(regime, age, R).find(([t]) => slabInc <= t)[1];
  return { total: before * (1 + cess), cess: before * cess, slabInc, taxable: total, std, top: isNew && total <= +R.rebateNewLimit ? 0 : top };
}

/* Instalments and the interest charged for missing them. Tax due = whole-year tax minus whole-year TDS. */
function advancePlan(due, payments, fy, today, R = DEFAULT_RULES) {
  const defs = R.instalments.map(x => [Date.UTC(+x.m >= 4 ? fy : fy + 1, x.m - 1, +x.d), +x.pct, +x.safe, +x.months]).sort((a, b) => a[0] - b[0]);
  const pays = (payments || []).filter(p => p.date && +p.amt > 0).map(p => [dn(p.date), +p.amt]);
  const paidBy = cut => pays.reduce((s, [d, a]) => s + (d <= cut ? a : 0), 0);
  const paidTotal = pays.reduce((s, [, a]) => s + a, 0), yearEnd = Date.UTC(fy + 1, 2, 31) / DAY;
  const hundred = x => Math.floor(x / 100) * 100;
  let covered = paidTotal, foundNext = false, locked = 0;
  const rows = defs.map(([ms, pct, safe, months]) => {
    const date = ms / DAY, required = due * pct / 100, paid = paidBy(date), past = date < today;
    const shortfall = Math.max(required - paid, 0), charged = paid < due * safe / 100 ? hundred(shortfall) * months * R.lateRate / 100 : 0;
    let toPay = 0, state;

const yearHasEntries = y => {
  const inc = (S.tax.income || {})[y] || {};
  return !!(S.rules || {})[y] || Object.values(inc).some(v => Array.isArray(v) ? v.length : v !== '' && v != null);

/* The current and previous year, plus any year you added or entered something in, with no gaps. */
function fyOptions() {
  const now = fyOf(todayDn());
  const set = new Set([now, now - 1, ...(S.years || []).map(Number), ...Object.keys(S.tax.income || {}).map(Number).filter(yearHasEntries), ...Object.keys(S.rules || {}).map(Number)]);
  const low = Math.min(...set), high = Math.max(...set), out = [];
  for (let y = low; y <= high; y++) out.push(y);

}

const COPY_YEAR_FIELDS = ['salary', 'rent', 'biz', 'other', 'oldDed', 'tdsSalary', 'tdsOther', 'misc'];
function yearFigures(fy, items, t, today) {
  const R = rulesFor(fy), c = taxCalc(items, fy, t, R), estimatedTds = c.tds, inc = (t.income || {})[fy] || {};
  const hasIncome = ['salary', 'rent', 'biz', 'other', 'stcg', 'ltcg'].some(k => n0(inc[k]) > 0) || (inc.misc || []).some(m => n0(m.amt) > 0);
  if (inc.bankTds !== '' && inc.bankTds != null) c.tds = n0(inc.bankTds);
  let full = null;
  if (hasIncome) {
    full = fullTax(inc, t.regime, t.age, c.interest, c.deduction, R);
    c.tax = Math.max(full.total - fullTax(inc, t.regime, t.age, 0, 0, R).total, 0);
    c.effective = c.interest ? c.tax / c.interest : 0;
  }
  c.net = c.tax - c.tds;
  const totalTax = full ? full.total : c.tax, miscTax = (inc.misc || []).reduce((s, m) => s + n0(m.tax), 0), allTds = c.tds + n0(inc.tdsSalary) + n0(inc.tdsOther) + miscTax;
  const afterTds = Math.max(totalTax - allTds, 0), required = afterTds >= +R.advanceMin && !(t.age === 'senior' && !(n0(inc.biz) > 0));
  const plan = advancePlan(required ? afterTds : 0, inc.payments, fy, today, R);

  return { R, c, estimatedTds, hasIncome, full, totalTax, miscTax, allTds, afterTds, required, plan, paidAll, balance };
}

function ruleProblems(R) {
  const out = [], rising = (rows, k) => rows.every((x, i) => !i || +x[k] > +rows[i - 1][k]);
  const ok = x => x !== '' && x != null && +x >= 0;
  for (const [key, name] of [['newSlabs', 'New regime'], ['oldSlabs', 'Old regime']]) {
    const limits = R[key].slice(0, -1);
    if (!limits.every(s => ok(s.upto)) || !rising(limits, 'upto')) out.push(`${name} slab limits must rise from row to row.`);
    if (!R[key].every(s => ok(s.rate) && +s.rate <= 100)) out.push(`${name} slab rates must be between 0 and 100%.`);
  }
  if (R.oldSlabs[1] && R.oldSlabs[1].upto != null && +R.oldSeniorExempt >= +R.oldSlabs[1].upto) out.push('The exemption limit for age 60 or above must be below the second old regime slab limit.');
  if (!rising(R.surcharge, 'over')) out.push('Surcharge income levels must rise from row to row.');
  if (!rising(R.instalments, 'pct') || +R.instalments[R.instalments.length - 1].pct !== 100) out.push('Instalment shares must rise and end at 100%.');
  if (R.instalments.some(x => +x.safe > +x.pct)) out.push('The no-interest share cannot be higher than the instalment share.');
  if (R.instalments.some(x => !(+x.d >= 1 && +x.d <= 31))) out.push('Instalment days must be between 1 and 31.');
  return out;
}

}

  const fallback = () => { const rng = document.createRange(); rng.selectNode(selectEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rng); done('Selected: press Ctrl+C', 'Ctrl+C') };
  try { navigator.clipboard.writeText(value).then(() => done('Copied', '✓'), fallback) } catch (e) { fallback() }
}
/* Every headline figure gets a copy button; the plain number pastes cleanly into a tax challan or a sheet. */
const COPY_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"></path></svg>';
function addTileCopy(root) {

for (const id of ['results', 'taxpage']) { const root = $(id); new MutationObserver(() => addTileCopy(root)).observe(root, { childList: true }) }

/* Google sign-in. Only runs where a client ID is configured (the hosted copy).
   Browser-only apps get no refresh token, so the short-lived access token is kept until it expires,
   then renewed without a prompt on the next click or key press (Google requires a user action to open its window). */
const CLIENT_ID = window.BYAJ_GOOGLE_CLIENT_ID, DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata', FILE_NAME = 'byaj-ledger.json';
const TOKEN_KEY = 'byaj-token', RENEW_MARGIN = 5 * 60 * 1000, RENEW_RETRY = 10 * 60 * 1000;
let token = null, tokenExpiry = 0, tokenClient = null, silentAt = 0, silentPending = false;
function keepToken(value, expiresIn) {
  token = value; tokenExpiry = Date.now() + (+expiresIn || 3600) * 1000;
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ value, expiry: tokenExpiry })) } catch (e) {}
}
function dropToken() {
  token = null; tokenExpiry = 0;
  try { localStorage.removeItem(TOKEN_KEY) } catch (e) {}
}
function restoreToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(TOKEN_KEY));
    if (saved && saved.expiry > Date.now() + 60000) { token = saved.value; tokenExpiry = saved.expiry; return true }
    localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
  return false;
}
function renewSilently(e) {
  if (!tokenClient || !sync || (e.target.closest && e.target.closest('#sync button'))) return;
  const v = sync.view();
  if (!v.email || silentPending || ['off', 'choice', 'connecting'].includes(v.status)) return;
  if (tokenExpiry - Date.now() > RENEW_MARGIN || Date.now() - silentAt < RENEW_RETRY) return;
  silentAt = Date.now(); silentPending = true;
  tokenClient.requestAccessToken({ prompt: 'none', login_hint: v.email });
}

function driveApi() {
  const call = async (url, opts = {}) => {
    const res = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
    if (res.status === 404) return null;
    if (res.status === 401) dropToken();
    if (!res.ok) throw { status: res.status };
    return res.json();
  };
  const API = 'https://www.googleapis.com/drive/v3/files', UP = 'https://www.googleapis.com/upload/drive/v3/files';
  return {
    whoami: async () => { const r = await call('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)'); return r && r.user ? r.user.emailAddress : null },
    find: async () => { const r = await call(`${API}?spaces=appDataFolder&orderBy=modifiedTime%20desc&pageSize=1&fields=files(id,version)&q=${encodeURIComponent(`name='${FILE_NAME}'`)}`); return r && r.files[0] || null },
    meta: id => call(`${API}/${id}?fields=id,version`),
    read: id => call(`${API}/${id}?alt=media`),
    create: body => {
      const b = 'byaj' + Date.now(), part = o => `Content-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(o)}\r\n`;
      return call(`${UP}?uploadType=multipart&fields=id,version`, { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` },
        body: `--${b}\r\n${part({ name: FILE_NAME, parents: ['appDataFolder'] })}--${b}\r\n${part(body)}--${b}--` });
    },
    update: (id, body) => {
      const text = JSON.stringify(body);   // keepalive lets a save finish as the tab closes, but only for small requests
      return call(`${UP}/${id}?uploadType=media&fields=id,version`, { method: 'PATCH', keepalive: text.length < 60000, headers: { 'Content-Type': 'application/json' }, body: text });
    }
  };
}
function renderSync(v) {
  const el = $('sync'), when = v.savedAt ? new Date(v.savedAt).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
  const who = v.email ? ` as ${esc(v.email)}` : '';
  const signIn = label => `<button class="primary" id="sync-in">${label}</button>`;
  const out = `<button id="sync-out">Sign out</button>`, forget = `<button class="link danger" id="sync-forget">Sign out and remove from this browser</button>`;
  const VIEW = {
    off: [`<b>Save to Google Drive</b><br><span class="hint">Sign in to keep your data across devices. It goes to a private app folder in your own Drive.</span>`, signIn('Sign in with Google')],
    signin: [`<b>Reconnecting to Drive on your next click</b><br><span class="hint">A Google window may flash briefly. If you stay disconnected, sign in here.</span>`, signIn('Sign in with Google') + forget],
    connecting: [`Connecting to Google Drive…`, ''],
    saving: [`Saving to Google Drive…`, ''],
    saved: [`<b>Saved to Google Drive${when ? ` at ${when}` : ''}</b><br><span class="hint">Signed in${who}. Changes save automatically.</span>`, out + forget],
    offline: [`<b>Not saved yet</b><br><span class="hint">Google Drive cannot be reached. Your changes are on this device and will save when the connection returns.</span>`, out],
    expired: [`<b>Reconnecting to Drive on your next click</b><br><span class="hint">Your Google session ended. Your changes are on this device and will save once reconnected. If you stay disconnected, sign in here.</span>`, signIn('Sign in again')],
    error: [`<b>Could not save to Drive</b><br><span class="hint">${esc(v.message)}</span>`, signIn('Try again') + out],
    unset: [`<b>Google sign-in is not set up yet</b><br><span class="hint">Add your client ID to config.js. Your data is saved only in this browser for now.</span>`, '']
  };
  if (v.status === 'choice') {
    const c = v.choice, d = c.remote ? `Drive has ${c.remote.deposits} deposit${c.remote.deposits === 1 ? '' : 's'}${c.remote.savedAt ? `, saved ${new Date(c.remote.savedAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}` : ''}. ` : '';
    const l = `This device has ${c.local.deposits}.`;
    const head = { both: 'This device and Google Drive have different data', otherAccount: 'This device has data from another Google account', newAccount: 'This device has data from another Google account' }[c.kind];
    const acts = c.kind === 'newAccount'
      ? `<button class="primary" data-choice="examples">Start fresh in this account</button><button data-choice="local">Copy this device's data here</button>`
      : `<button class="primary" data-choice="drive">Use the Drive copy</button><button data-choice="local">Replace Drive with this device's copy</button>`;
    el.innerHTML = `<div style="min-width:0"><b>${head}</b><br><span class="hint">${d}${l} The copy you do not pick is replaced.</span></div><div class="acts">${acts}</div>`;
  } else el.innerHTML = `<div style="min-width:0">${VIEW[v.status][0]}</div><div class="acts">${VIEW[v.status][1]}</div>`;
  $('savehint').textContent = ['saved', 'saving'].includes(v.status) ? 'Saved to Google Drive.' : ['offline', 'expired', 'choice', 'error'].includes(v.status) ? 'Saved in this browser, waiting for Drive.' : 'Saved only in this browser.';
}
function signIn() {
  if (!tokenClient) { renderSync({ status: 'error', message: 'Google sign-in could not load. Check your connection and reload the page.' }); return }
  tokenClient.requestAccessToken();
}
function startGoogle() {
  $('sync').hidden = false;
  if (!CLIENT_ID) { renderSync({ status: 'unset' }); return }
  const store = {
    load: () => { try { return JSON.parse(localStorage.getItem('byaj-sync')) || {} } catch (e) { return {} } },
    save: m => { try { localStorage.setItem('byaj-sync', JSON.stringify(m)) } catch (e) {} }
  };
  sync = createDriveSync({ api: driveApi(), readLocal: payload, applyRemote: applyData, isPristine, store, onState: renderSync });
  renderSync(sync.view());
  const ready = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: DRIVE_SCOPE,
      callback: r => {
        const silent = silentPending;
        silentPending = false;
        if (r.error || !google.accounts.oauth2.hasGrantedAllScopes(r, DRIVE_SCOPE)) {
          if (silent) return renderSync(sync.view());   // the Sign in button stays available
          renderSync({ status: 'error', message: 'Drive permission was not given, so nothing was saved. Sign in and allow it to continue.' });
          return;
        }
        keepToken(r.access_token, r.expires_in);

      },
      error_callback: () => { silentPending = false; renderSync(sync.view()) }

  addEventListener('keydown', renewSilently, true);

  addEventListener('online', () => sync.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) sync.flush() });
  addEventListener('pagehide', () => sync.flush());
}

renderEditor();
render();
if (CLIENT_ID !== undefined) startGoogle();
</script>
